      (function () {
        try {
          var stored = localStorage.getItem('sac_theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
